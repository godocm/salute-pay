[package]
name = "salute_pay"
version = "0.1.0"
description = "Keyless per-order Solana payment vault with permissionless settlement"
edition = "2021"

[lib]
# Deployable program only: enables the workspace's fat LTO in cargo-build-sbf.
crate-type = ["cdylib"]
name = "salute_pay"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Anchor 1.2's host IDL builder references token_interface unconditionally.
# Enable its dependency only for IDL generation, not the deployed classic SPL binary.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["associated_token", "token"] }

solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
